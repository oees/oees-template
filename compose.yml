# Local development only; production runs on App Platform from .do/app.yaml.
# First run: cp .env.example .env && docker compose up --build
# Tooling runs in the container: docker compose run --rm app make check
# Or on the host against the compose db: docker compose up -d db && make check-fast

x-app: &app
  build:
    context: .
    target: dev
  # Your host user, so files written into the checkout (caches, coverage, new
  # migrations) stay yours. Set HOST_UID and HOST_GID in .env when they are not 1000.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  env_file: .env
  environment:
    HOME: /tmp
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  db:
    # Pinned by tag and digest. Bump both together: docker pull <tag> && docker inspect <tag>.
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    # For host runs of the gate. Set POSTGRES_PORT in .env when 5432 is in use.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # Postgres 18 images keep their data under /var/lib/postgresql, and refuse the old
    # /var/lib/postgresql/data mount.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
