# DigitalOcean App Platform spec. App Platform builds and deploys every push to main
# (deploy_on_push), and runs the migrate job before each rollout. main changes only
# through a reviewed pull request with a green ci, so a merge is a deploy.
# Tech creates the app from this file once. After that, App Platform keeps its own copy:
# a change to this file reaches the app only when tech applies it (docs/deploy-runbook.md).
# Secrets have no value here: tech sets each one in the App Platform console, encrypted.
# ${db.DATABASE_URL}, ${APP_DOMAIN} and ${APP_URL} are App Platform references.
# Edit only the lines marked EDIT.
name: website-prod # EDIT: SITE-prod
region: ams # Same region as the cluster oees-tech-template-repo-ddbb. Do not change.

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

envs:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
    scope: RUN_AND_BUILD_TIME
  - key: DJANGO_SECRET_KEY # tech sets the value in the console, encrypted
    type: SECRET
    scope: RUN_TIME
  - key: DATABASE_URL
    value: ${db.DATABASE_URL}
    scope: RUN_TIME
  - key: DJANGO_ALLOWED_HOSTS
    value: ${APP_DOMAIN}
    scope: RUN_TIME
  - key: DJANGO_CSRF_TRUSTED_ORIGINS
    value: ${APP_URL}
    scope: RUN_TIME
  - key: LOG_LEVEL
    value: INFO
    scope: RUN_TIME

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: oees/website # EDIT: the GitHub repository (owner/name)
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 2
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: oees/website # EDIT: the GitHub repository (owner/name)
      branch: main
      deploy_on_push: true
    run_command: python manage.py migrate --noinput
    instance_size_slug: apps-s-1vcpu-1gb

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /

# The cluster for every site made from this template: one database and one user per site.
# App Platform did not create it, so attaching it here does NOT
# create the database or the user, and does NOT add this app to the cluster firewall.
# Tech does all three by hand: see docs/deploy-runbook.md. Never use doadmin as db_user.
databases:
  - name: db
    engine: PG
    version: "18"
    production: true
    cluster_name: oees-tech-template-repo-ddbb
    db_name: website # EDIT: the site slug with underscores; tech creates the database
    db_user: website # EDIT: the site slug with underscores; tech creates the user

# Add only after tech confirms the hostname and DNS.
# domains:
#   - domain: www.example.com # EDIT
#     type: PRIMARY
